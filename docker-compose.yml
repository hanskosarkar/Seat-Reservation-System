services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seat
      POSTGRES_PASSWORD: seat
      POSTGRES_DB: seatdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seat -d seatdb"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://seat:seat@db:5432/seatdb
      JWT_SECRET: local-dev-secret-change-me
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
